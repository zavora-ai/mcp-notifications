server_id = "mcp_notifications"
display_name = "Notifications"
version = "1.2.0"
domain = "notifications"
sdk_version = "0.3.0"
risk_level = "medium"
writes_allowed = "gated"
transports = ["stdio"]
credentials = ["MCP_NOTIFICATIONS_BEARER_TOKEN"]
governance_gates = ["mrtr_approval"]
environments = ["development", "staging", "production"]

[[tools]]
name = "send_notification"
description = "Attempt real delivery; report delivered only after an endpoint accepts the request"
risk_class = "external_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "send_from_template"
description = "Send a notification using a template with variable substitution"
risk_class = "external_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "broadcast"
description = "Broadcast a notification to multiple recipients"
risk_class = "external_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "list_notifications"
description = "List recorded delivery attempts, optionally filtered by channel"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_status"
description = "Get notification delivery status"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "list_templates"
description = "List notification templates"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_template"
description = "Get template details"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_template"
description = "Create a notification template"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_preferences"
description = "Get user notification preferences"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "update_preferences"
description = "Update user notification preferences"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_delivery_stats"
description = "Get truthful queued, delivered, suppressed, and failed delivery counts"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "schedule_notification"
description = "Queue a notification record; no scheduler or delivery is claimed"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "retry_notification"
description = "Retry a failed notification"
risk_class = "external_write"
requires_approval = true
credential_bindings = []
