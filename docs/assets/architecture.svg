<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1100" height="560" rx="16" fill="#0f172a"/>
  <text x="550" y="34" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">mcp-notifications v1.2 — truthful delivery architecture</text>
  <text x="550" y="56" text-anchor="middle" fill="#94a3b8" font-size="12">rmcp 3.1.2 · MCP 2025-11-25 + 2026-07-28 · adk-mcp-sdk 0.3.0</text>

  <g fill="#1e293b" stroke="#475569">
    <rect x="35" y="110" width="185" height="120" rx="10"/>
    <rect x="270" y="85" width="240" height="170" rx="10"/>
    <rect x="560" y="85" width="230" height="170" rx="10"/>
    <rect x="840" y="85" width="225" height="170" rx="10"/>
    <rect x="270" y="315" width="240" height="145" rx="10"/>
    <rect x="560" y="315" width="230" height="145" rx="10"/>
    <rect x="840" y="315" width="225" height="145" rx="10"/>
  </g>

  <g fill="#f8fafc" font-size="14" font-weight="700">
    <text x="128" y="140" text-anchor="middle">MCP clients</text>
    <text x="390" y="115" text-anchor="middle">Protocol handler</text>
    <text x="675" y="115" text-anchor="middle">Tool layer (13)</text>
    <text x="952" y="115" text-anchor="middle">Delivery router</text>
    <text x="390" y="345" text-anchor="middle">Policy and metadata</text>
    <text x="675" y="345" text-anchor="middle">Attempt ledger</text>
    <text x="952" y="345" text-anchor="middle">Status contract</text>
  </g>

  <g fill="#cbd5e1" font-size="12">
    <text x="128" y="168" text-anchor="middle">Codex · Claude · Cursor</text>
    <text x="128" y="188" text-anchor="middle">stdio JSON-RPC</text>

    <text x="390" y="143" text-anchor="middle">initialize · tools/list · tools/call</text>
    <text x="390" y="165" text-anchor="middle">outputSchema + structuredContent</text>
    <text x="390" y="187" text-anchor="middle">MCP Tasks for broadcast</text>
    <text x="390" y="209" text-anchor="middle">24 h public discovery cache</text>

    <text x="675" y="143" text-anchor="middle">send · template · broadcast</text>
    <text x="675" y="165" text-anchor="middle">queue · retry · tracking</text>
    <text x="675" y="187" text-anchor="middle">templates · preferences</text>
    <text x="675" y="209" text-anchor="middle">JSON result normalization</text>

    <text x="952" y="143" text-anchor="middle">Direct HTTPS webhook / Slack</text>
    <text x="952" y="165" text-anchor="middle">Email · SMS · push adapters</text>
    <text x="952" y="187" text-anchor="middle">Optional bearer authentication</text>
    <text x="952" y="209" text-anchor="middle">Local in-app queue</text>

    <text x="390" y="373" text-anchor="middle">MRTR for external delivery</text>
    <text x="390" y="395" text-anchor="middle">risk + idempotency annotations</text>
    <text x="390" y="417" text-anchor="middle">endpoint paths redacted</text>

    <text x="675" y="373" text-anchor="middle">attempted_at · delivered_at</text>
    <text x="675" y="395" text-anchor="middle">delivery path + HTTP outcome</text>
    <text x="675" y="417" text-anchor="middle">retry preserves original route</text>

    <text x="952" y="373" text-anchor="middle" fill="#60a5fa">queued = no attempt claimed</text>
    <text x="952" y="395" text-anchor="middle" fill="#34d399">delivered = endpoint returned 2xx</text>
    <text x="952" y="417" text-anchor="middle" fill="#fbbf24">suppressed = preference / quiet hours</text>
    <text x="952" y="439" text-anchor="middle" fill="#f87171">failed = missing path or delivery error</text>
  </g>

  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M220 170 H270"/><path d="M510 170 H560"/><path d="M790 170 H840"/>
    <path d="M390 255 V315"/><path d="M675 255 V315"/><path d="M952 255 V315"/>
    <path d="M510 387 H560"/><path d="M790 387 H840"/>
  </g>
  <text x="550" y="525" text-anchor="middle" fill="#64748b" font-size="12">No provider configured → structured failure. The server never fabricates Sent or Delivered.</text>
</svg>
