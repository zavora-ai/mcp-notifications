<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="system-ui,-apple-system,sans-serif" font-size="13">
  <defs>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="920" height="400" rx="12" fill="#0f172a"/>
  <text x="460" y="28" text-anchor="middle" fill="#94a3b8" font-size="11">MCP NOTIFICATIONS — MULTI-CHANNEL DELIVERY</text>

  <!-- Clients -->
  <rect x="20" y="110" width="130" height="160" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="85" y="130" text-anchor="middle" fill="#94a3b8" font-size="10">MCP CLIENTS</text>
  <rect x="30" y="142" width="110" height="20" rx="3" fill="#334155"/>
  <text x="85" y="156" text-anchor="middle" fill="#f1f5f9" font-size="9">Claude / Kiro</text>
  <rect x="30" y="167" width="110" height="20" rx="3" fill="#334155"/>
  <text x="85" y="181" text-anchor="middle" fill="#f1f5f9" font-size="9">Cursor / Codex</text>
  <rect x="30" y="192" width="110" height="20" rx="3" fill="#334155"/>
  <text x="85" y="206" text-anchor="middle" fill="#f1f5f9" font-size="9">Windsurf</text>

  <line x1="150" y1="190" x2="200" y2="190" stroke="#6366f1" stroke-width="2"/>
  <polygon points="200,185 210,190 200,195" fill="#6366f1"/>

  <!-- Server -->
  <rect x="210" y="50" width="310" height="310" rx="8" fill="url(#nGrad)" opacity="0.1" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="365" y="72" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">mcp-notifications</text>
  <text x="365" y="88" text-anchor="middle" fill="#64748b" font-size="9">Rust · rmcp 1.7 · 13 tools</text>

  <rect x="222" y="100" width="140" height="60" rx="4" fill="#1e293b"/>
  <text x="292" y="116" text-anchor="middle" fill="#38bdf8" font-size="9">SEND (4)</text>
  <text x="292" y="131" text-anchor="middle" fill="#64748b" font-size="8">send · from_template</text>
  <text x="292" y="143" text-anchor="middle" fill="#64748b" font-size="8">broadcast · schedule</text>

  <rect x="368" y="100" width="140" height="60" rx="4" fill="#1e293b"/>
  <text x="438" y="116" text-anchor="middle" fill="#34d399" font-size="9">TEMPLATES (3)</text>
  <text x="438" y="131" text-anchor="middle" fill="#64748b" font-size="8">list · get · create</text>
  <text x="438" y="143" text-anchor="middle" fill="#64748b" font-size="8">variable substitution</text>

  <rect x="222" y="170" width="140" height="50" rx="4" fill="#1e293b"/>
  <text x="292" y="186" text-anchor="middle" fill="#a78bfa" font-size="9">TRACKING (3)</text>
  <text x="292" y="201" text-anchor="middle" fill="#64748b" font-size="8">list · status · retry</text>

  <rect x="368" y="170" width="140" height="50" rx="4" fill="#1e293b"/>
  <text x="438" y="186" text-anchor="middle" fill="#fb923c" font-size="9">PREFERENCES (3)</text>
  <text x="438" y="201" text-anchor="middle" fill="#64748b" font-size="8">get · update · stats</text>

  <rect x="222" y="230" width="286" height="24" rx="4" fill="#1e293b"/>
  <text x="365" y="246" text-anchor="middle" fill="#94a3b8" font-size="9">Quiet hours · Channel preferences · Delivery tracking</text>

  <!-- Channels -->
  <rect x="560" y="80" width="320" height="240" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="720" y="105" text-anchor="middle" fill="#94a3b8" font-size="10">DELIVERY CHANNELS</text>

  <rect x="580" y="120" width="130" height="24" rx="12" fill="#334155" stroke="#38bdf8"/>
  <text x="645" y="136" text-anchor="middle" fill="#38bdf8" font-size="9">📧 Email</text>
  <rect x="720" y="120" width="130" height="24" rx="12" fill="#334155" stroke="#34d399"/>
  <text x="785" y="136" text-anchor="middle" fill="#34d399" font-size="9">📱 SMS</text>

  <rect x="580" y="155" width="130" height="24" rx="12" fill="#334155" stroke="#fbbf24"/>
  <text x="645" y="171" text-anchor="middle" fill="#fbbf24" font-size="9">🔔 Push</text>
  <rect x="720" y="155" width="130" height="24" rx="12" fill="#334155" stroke="#a78bfa"/>
  <text x="785" y="171" text-anchor="middle" fill="#a78bfa" font-size="9">💬 In-App</text>

  <rect x="580" y="190" width="130" height="24" rx="12" fill="#334155" stroke="#fb923c"/>
  <text x="645" y="206" text-anchor="middle" fill="#fb923c" font-size="9">🔗 Webhook</text>
  <rect x="720" y="190" width="130" height="24" rx="12" fill="#334155" stroke="#f87171"/>
  <text x="785" y="206" text-anchor="middle" fill="#f87171" font-size="9">💼 Slack</text>

  <!-- Templates -->
  <rect x="580" y="230" width="270" height="70" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="715" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">TEMPLATES</text>
  <text x="715" y="264" text-anchor="middle" fill="#64748b" font-size="8">Welcome Email · OTP SMS · System Alert</text>
  <text x="715" y="278" text-anchor="middle" fill="#64748b" font-size="8">Variables: {{name}}, {{code}}, {{title}}</text>
  <text x="715" y="292" text-anchor="middle" fill="#64748b" font-size="8">Delivery: Queued → Sent → Delivered</text>

  <text x="460" y="385" text-anchor="middle" fill="#475569" font-size="10">mcp-notifications v1.0.0 · 13 tools · 6 channels · Templates · Preferences · Delivery tracking</text>
</svg>
