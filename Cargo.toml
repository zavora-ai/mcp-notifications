[package]
name = "mcp-notifications"
version = "1.0.0"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Notifications MCP Server — push, SMS, email, in-app, webhooks, templates, and delivery tracking for AI agents"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-notifications"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "notifications", "push", "sms", "webhooks"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[workspace]
